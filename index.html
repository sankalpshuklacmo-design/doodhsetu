<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DoodhSetu — Shop Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f4eee4;
      --paper: #fffcf7;
      --ink: #1a120b;
      --muted: #7a6754;
      --line: #eadcC8;
      --milk: #fff8ea;
      --saffron: #d35400;
      --saffron-d: #a63d00;
      --green: #1f6b3a;
      --green-s: #e5f6ea;
      --chip: #f0e6d4;
      --shadow: 0 12px 40px rgba(60, 32, 8, 0.08);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: #e8dfd0; color: var(--ink);
      font-family: Outfit, "Tiro Devanagari Hindi", system-ui, sans-serif;
    }
    h1, h2, h3, .dev { font-family: "Tiro Devanagari Hindi", Outfit, serif; font-weight: 400; }
    button, input, select { font-family: inherit; }
    a { color: var(--saffron); text-decoration: none; }
    .app {
      max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative;
      background:
        radial-gradient(1200px 400px at 20% -10%, #ffe7c2 0%, transparent 55%),
        linear-gradient(180deg, #fffaf1 0%, #f3eadc 220px, #efe6d8 100%);
    }
    .topbar {
      padding: 14px 16px 8px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 5;
      background: rgba(255,250,241,.82);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; gap: 10px; align-items: center; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(160deg, #f6c56a, #d35400 70%);
      display: grid; place-items: center; color: white; font-weight: 700; font-size: 18px;
      box-shadow: 0 8px 18px rgba(211,84,0,.28);
    }
    .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
    .screen { padding: 6px 16px 110px; }
    .card {
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .hero {
      background:
        linear-gradient(135deg, rgba(26,18,11,.15), transparent 40%),
        linear-gradient(160deg, #2a170c 0%, #7a3a12 52%, #e07a20 130%);
      color: #fff8ea; border: none; padding: 22px 18px 20px;
      box-shadow: 0 18px 40px rgba(80,30,0,.22);
    }
    .hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; }
    .hero p { margin: 0; opacity: .88; font-size: 14px; line-height: 1.45; }
    .row { display: flex; gap: 8px; }
    .grow { flex: 1; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid #e6d7c2;
      background: #fff; font-size: 16px; color: var(--ink); outline: none;
    }
    input:focus, select:focus { border-color: #d35400; box-shadow: 0 0 0 3px rgba(211,84,0,.12); }
    .btn {
      border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 650; font-size: 15px;
      cursor: pointer; width: 100%;
    }
    .btn-primary {
      background: linear-gradient(180deg, #e36a14, #c24a00);
      color: white; box-shadow: 0 8px 18px rgba(211,84,0,.28);
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-dark { background: var(--ink); color: var(--milk); }
    .btn-ghost { background: #fff; border: 1px solid #e4d4be; color: var(--ink); }
    .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; border-radius: 999px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .tab {
      border: 1px solid #eadcc8; background: #fff; border-radius: 16px; padding: 12px 10px;
      text-align: center; cursor: pointer; font-weight: 600;
    }
    .tab.on { background: var(--ink); color: #fff6e8; border-color: var(--ink); }
    .tab small { display: block; opacity: .65; font-size: 11px; margin-top: 3px; font-weight: 500; }
    .prod {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid #f0e6d6;
    }
    .prod:last-child { border-bottom: 0; }
    .emoji {
      width: 46px; height: 46px; border-radius: 16px;
      background: linear-gradient(180deg, #fff7ea, #f3e4cc);
      display: grid; place-items: center; font-size: 22px;
    }
    .prod h4 { margin: 0; font-size: 15px; font-weight: 650; }
    .prod p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 6px; background: #f7f0e4; border-radius: 999px; padding: 4px; }
    .stepper button {
      width: 32px; height: 32px; border-radius: 50%; border: 0;
      background: #fff; font-size: 18px; cursor: pointer; color: var(--ink);
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }
    .stepper span { min-width: 22px; text-align: center; font-weight: 700; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: var(--ink); color: white; padding: 12px 18px; border-radius: 999px;
      font-size: 14px; display: none; z-index: 20; white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .kpi { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kpi div {
      background: #fff; border-radius: 18px; padding: 12px 10px;
      box-shadow: var(--shadow);
    }
    .kpi b { display: block; font-size: 22px; letter-spacing: -.03em; }
    .kpi span { font-size: 11px; color: var(--muted); font-weight: 500; }
    .order-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed #eadcc8; }
    .status { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--green-s); color: var(--green); font-weight: 650; }
    .status.pending { background: #ffe7d0; color: #9a4208; }
    .login-choice { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .choice b { font-size: 13px; display: block; margin-top: 6px; }
    .choice {
      border: 1px solid #eadcc8; border-radius: 18px; padding: 14px 6px; text-align: center;
      background: #fff; cursor: pointer;
    }
    .choice.on {
      border-color: #d35400; background: #fff4e8;
      box-shadow: 0 0 0 3px rgba(211,84,0,.12);
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .footer-note { text-align: center; color: var(--muted); font-size: 11px; padding: 8px 16px 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    td { padding: 10px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
    .pill { display: inline-block; background: var(--chip); border-radius: 999px; padding: 4px 9px; font-size: 11px; font-weight: 600; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast"></div>

<script>
const PRODUCTS = [
  { id: "cow500", name: "गाय का दूध", en: "Cow Milk 500ml", unit: "पैकेट", emoji: "🥛", price: 32 },
  { id: "cow1", name: "गाय का दूध", en: "Cow Milk 1L", unit: "पैकेट", emoji: "🥛", price: 60 },
  { id: "buf500", name: "भैंस का दूध", en: "Buffalo 500ml", unit: "पैकेट", emoji: "🥛", price: 38 },
  { id: "buf1", name: "भैंस का दूध", en: "Buffalo 1L", unit: "पैकेट", emoji: "🥛", price: 72 },
  { id: "dahi200", name: "दही", en: "Dahi 200g", unit: "कप", emoji: "🥣", price: 25 },
  { id: "dahi400", name: "दही", en: "Dahi 400g", unit: "कप", emoji: "🥣", price: 45 },
  { id: "paneer", name: "पनीर", en: "Paneer 200g", unit: "पैक", emoji: "🧀", price: 90 },
  { id: "ghee", name: "देशी घी", en: "Ghee 500ml", unit: "डिब्बा", emoji: "🫙", price: 320 },
];

const DEFAULT_SHOPS = [
  { id: "s1", name: "शर्मा जनरल स्टोर", area: "राजेंद्र नगर", address: "12, राजेंद्र नगर मुख्य मार्ग, लखनऊ — 226004", phone: "9876543210", pin: "1111" },
  { id: "s2", name: "गणेश किराना", area: "सुंदर नगर", address: "45, सुंदर नगर चौक, लखनऊ — 226017", phone: "9123456780", pin: "2222" },
  { id: "s3", name: "माँ लक्ष्मी स्टोर", area: "स्टेशन रोड", address: "8/21, स्टेशन रोड, चौक, लखनऊ — 226003", phone: "9988776655", pin: "3333" },
];

const VENDOR = { pin: "9999", name: "राम डेयरी" };
const ADMIN = { pin: "9999", name: "Admin" };

const KEY = "doodhsetu_v3";

function withStatus(list) {
  return list.map(s => ({ ...s, status: s.status || "approved" }));
}

function load() {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (!s.shops) s.shops = withStatus(DEFAULT_SHOPS.slice());
    else s.shops = s.shops.map(x => ({ ...x, status: x.status || "approved" }));
    if (!s.orders) s.orders = [];
    if (!s.vendorPin || s.vendorPin === "0000") s.vendorPin = "9999";
    if (!s.adminPin) s.adminPin = "9999";
    return s;
  }
  return { orders: [], shops: withStatus(DEFAULT_SHOPS.slice()), vendorPin: VENDOR.pin, adminPin: ADMIN.pin };
}
function save(state) { localStorage.setItem(KEY, JSON.stringify(state)); }
function shops() { return state.shops; }
function approvedShops() { return state.shops.filter(s => s.status === "approved"); }
function pendingShops() { return state.shops.filter(s => s.status === "pending"); }
function shopById(id) { return state.shops.find(s => s.id === id); }
function shopByPhone(phone) {
  const p = String(phone||"").replace(/\D/g,"");
  return state.shops.find(s => String(s.phone||"").replace(/\D/g,"") === p);
}

let state = load();
let session = JSON.parse(sessionStorage.getItem("doodh_session") || "null");
let cart = {};
let batch = "subah";
let loginRole = "shop";
let vendorTab = "orders";
let vcart = {};
let shopTab = "menu";
let showRegister = false;

function todayISO() {
  const d = new Date();
  const z = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function fmtDate(iso) {
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
}
function persistSession() {
  sessionStorage.setItem("doodh_session", JSON.stringify(session));
}

function render() {
  if (!session) return renderLogin();
  if (session.role === "admin") return renderAdmin();
  if (session.role === "vendor") return renderVendor();
  return renderShop();
}

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="logo">द</div>
        <div><strong>DoodhSetu</strong><small>Vendor × Shop orders</small></div>
      </div>
    </div>
    <div class="screen">
      <div class="card hero">
        <h1 class="dev">रोज़ का ऑर्डर,<br/>बिना कॉपी के।</h1>
        <p>दुकानदार ऐप से ऑर्डर भेजे। वेंडर को सुबह–शाम की पूरी लिस्ट मिल जाए।</p>
      </div>
      <div class="card">
        <label>आप कौन हैं?</label>
        <div class="login-choice">
          <div class="choice ${loginRole==="shop"?"on":""}" onclick="loginRole='shop';render()">
            <div style="font-size:24px">🏪</div>
            <b>दुकान</b>
          </div>
          <div class="choice ${loginRole==="vendor"?"on":""}" onclick="loginRole='vendor';render()">
            <div style="font-size:24px">🚚</div>
            <b>वेंडर</b>
          </div>
          <div class="choice ${loginRole==="admin"?"on":""}" onclick="loginRole='admin';render()">
            <div style="font-size:24px">🛡️</div>
            <b>एडमिन</b>
          </div>
        </div>
      </div>
      <div class="card">
        ${loginRole==="shop" ? (showRegister ? `
          <h3 class="dev" style="margin:0 0 8px">नई दुकान रजिस्टर</h3>
          <p class="hint" style="margin-top:0">एडमिन अप्रूव करने के बाद ही लॉगिन होगा। कोई और आपकी डिटेल यहाँ नहीं देख सकता।</p>
          <label>दुकान का नाम</label>
          <input id="rName" placeholder="सिर्फ आप और एडमिन देखेंगे" />
          <div style="height:8px"></div>
          <label>पता</label>
          <input id="rAddr" placeholder="पूरा पता" />
          <div style="height:8px"></div>
          <label>फोन नंबर</label>
          <input id="rPhone" inputmode="tel" placeholder="लॉगिन इसी नंबर से होगा" />
          <p class="hint">PIN दुकान नहीं बनाएगी। एडमिन अप्रूव करके PIN देगा।</p>
          <div style="height:12px"></div>
          <button class="btn btn-primary" onclick="registerShop()">अप्रूवल के लिए भेजें</button>
          <div style="height:8px"></div>
          <button class="btn btn-ghost" onclick="showRegister=false;render()">वापस लॉगिन</button>
        ` : `
          <label>अपना फोन नंबर</label>
          <input id="phone" inputmode="tel" placeholder="रजिस्टर्ड फोन नंबर" />
          <div style="height:10px"></div>
          <label>एडमिन वाला PIN</label>
          <input id="pin" type="password" inputmode="numeric" placeholder="जो PIN एडमिन ने दिया" />
          <div style="height:12px"></div>
          <button class="btn btn-primary" onclick="doLogin()">लॉगिन</button>
          <div style="height:8px"></div>
          <button class="btn btn-ghost" onclick="showRegister=true;render()">नई दुकान रजिस्टर करें</button>
          <p class="hint">नाम/नंबर लिस्ट में नहीं दिखते। पहले रजिस्टर → एडमिन अप्रूव + PIN दे → फिर फोन और PIN से लॉगिन।</p>
          <div style="border-top:1px dashed #eadcc8;margin:18px 0 12px"></div>
          <h3 class="dev" style="margin:0 0 10px">वेंडर / एडमिन लॉगिन</h3>
          <label>वेंडर PIN</label>
          <input id="vLoginPin" type="password" inputmode="numeric" placeholder="9999" />
          <div style="height:8px"></div>
          <button class="btn btn-dark" onclick="staffLogin('vendor')">वेंडर लॉगिन</button>
          <div style="height:14px"></div>
          <label>एडमिन PIN</label>
          <input id="aLoginPin" type="password" inputmode="numeric" placeholder="9999" />
          <div style="height:8px"></div>
          <button class="btn btn-dark" onclick="staffLogin('admin')">एडमिन लॉगिन</button>
        `) : loginRole==="vendor" ? `
          <label>वेंडर PIN</label>
          <input id="pin" type="password" inputmode="numeric" placeholder="वेंडर PIN" />
          <div style="height:12px"></div>
          <button class="btn btn-primary" onclick="doLogin()">लॉगिन</button>
        ` : `
          <label>एडमिन PIN</label>
          <input id="pin" type="password" inputmode="numeric" placeholder="एडमिन PIN" />
          <div style="height:12px"></div>
          <button class="btn btn-primary" onclick="doLogin()">लॉगिन</button>
        `}
      </div>
    </div>
    <div class="footer-note">DoodhSetu demo · morning + evening batches</div>
  `;
}

function doLogin() {
  const pin = document.getElementById("pin").value.trim();
  if (loginRole === "admin") {
    if (pin !== state.adminPin) return toast("गलत एडमिन PIN — 9999 डालें");
    session = { role: "admin" };
  } else if (loginRole === "vendor") {
    if (pin !== state.vendorPin) return toast("गलत वेंडर PIN — 9999 डालें");
    session = { role: "vendor" };
  } else {
    const phone = document.getElementById("phone").value.trim();
    const shop = shopByPhone(phone);
    if (!shop) return toast("यह नंबर रजिस्टर नहीं है — पहले रजिस्टर करें");
    if (shop.status !== "approved") return toast("एडमिन अभी अप्रूव नहीं किया");
    if (!shop.pin) return toast("एडमिन ने PIN अभी नहीं दिया");
    if (pin !== shop.pin) return toast("गलत PIN — एडमिन से नया PIN लें");
    session = { role: "shop", shopId: shop.id };
    shopTab = "menu";
  }
  persistSession();
  cart = {};
  render();
}

function staffLogin(role) {
  const id = role === "admin" ? "aLoginPin" : "vLoginPin";
  const pin = (document.getElementById(id) || {}).value;
  const expected = role === "admin" ? state.adminPin : state.vendorPin;
  if (!pin || pin.trim() !== expected) return toast("गलत PIN — 9999 डालें");
  session = { role };
  persistSession();
  cart = {};
  render();
}

function logout() {
  session = null;
  sessionStorage.removeItem("doodh_session");
  render();
}

function renderShop() {
  const shop = shopById(session.shopId);
  const cartItems = PRODUCTS.filter(p => cart[p.id] > 0);
  const totalQty = Object.values(cart).reduce((a,b)=>a+b,0);
  const totalAmt = PRODUCTS.reduce((s,p)=> s + (cart[p.id]||0)*p.price, 0);
  const myOrders = state.orders
    .filter(o => o.shopId === shop.id)
    .sort((a,b) => (b.date+b.batch+b.id).localeCompare(a.date+a.batch+a.id))
    .slice(0, 8);

  const menuHtml = PRODUCTS.map(p => `
      <div class="prod">
        <div class="emoji">${p.emoji}</div>
        <div class="grow">
          <h4>${p.name}</h4>
          <p>${p.en} · ₹${p.price}/${p.unit}</p>
        </div>
        <button class="btn btn-dark btn-sm" onclick="chg('${p.id}',1);shopTab='cart';render()">कार्ट में</button>
      </div>`).join("");

  const cartHtml = cartItems.length===0 ? `<p class="hint">कार्ट खाली है। मेनू से आइटम डालें。</p>` : cartItems.map(p => `
      <div class="prod">
        <div class="emoji">${p.emoji}</div>
        <div class="grow">
          <h4>${p.name}</h4>
          <p>₹${p.price} × ${cart[p.id]} = ₹${p.price*cart[p.id]}</p>
        </div>
        <div class="stepper">
          <button onclick="chg('${p.id}',-1)">−</button>
          <span>${cart[p.id]}</span>
          <button onclick="chg('${p.id}',1)">+</button>
        </div>
      </div>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="logo">द</div>
        <div><strong>${shop.name}</strong><small>आपका अकाउंट</small></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">बाहर</button>
    </div>
    <div class="screen">
      <div class="tabs" style="grid-template-columns:1fr 1fr 1fr">
        <div class="tab ${shopTab==="menu"?"on":""}" onclick="shopTab='menu';render()">मेनू</div>
        <div class="tab ${shopTab==="cart"?"on":""}" onclick="shopTab='cart';render()">कार्ट${totalQty?` (${totalQty})`:""}</div>
        <div class="tab ${shopTab==="orders"?"on":""}" onclick="shopTab='orders';render()">ऑर्डर</div>
      </div>
      ${shopTab==="menu" ? `<div class="card">${menuHtml}</div>` : ""}
      ${shopTab==="cart" ? `
        <div class="tabs">
          <div class="tab ${batch==="subah"?"on":""}" onclick="batch='subah';render()">सुबह</div>
          <div class="tab ${batch==="shaam"?"on":""}" onclick="batch='shaam';render()">शाम</div>
        </div>
        <div class="card">
          ${cartHtml}
          <div style="display:flex;justify-content:space-between;margin-top:12px;align-items:center">
            <div><div class="hint">${totalQty} आइटम · ${batch==="subah"?"सुबह":"शाम"}</div><b>₹${totalAmt}</b></div>
            <div class="row" style="width:auto">
              <button class="btn btn-ghost btn-sm" onclick="repeatLast()">पिछला</button>
              <button class="btn btn-primary btn-sm" onclick="placeOrder()">ऑर्डर भेजें</button>
            </div>
          </div>
        </div>` : ""}
      ${shopTab==="orders" ? `
        <div class="card">
          <h3 class="dev" style="margin:0 0 8px">आपके ऑर्डर</h3>
          ${myOrders.length===0 ? `<p class="hint">अभी कोई ऑर्डर नहीं।</p>` :
            myOrders.map(o => `
              <div style="padding:8px 0;border-bottom:1px dashed #eadcc8">
                <div style="display:flex;justify-content:space-between">
                  <b>${fmtDate(o.date)} · ${o.batch==="subah"?"सुबह":"शाम"}</b>
                  <span class="status ${o.status==="pending"?"pending":""}">${o.status==="pending"?"लंबित":"डिलीवर"}</span>
                </div>
                <div class="hint">${o.items.map(i=>{
                  const p=PRODUCTS.find(x=>x.id===i.id); return `${p.en} × ${i.qty}`;
                }).join(" · ")}</div>
              </div>
            `).join("")}
        </div>` : ""}
    </div>
  `;
}

function chg(id, d) {
  cart[id] = Math.max(0, (cart[id]||0) + d);
  if (cart[id] === 0) delete cart[id];
  render();
}

function repeatLast() {
  const shop = shopById(session.shopId);
  const last = [...state.orders].reverse().find(o => o.shopId === shop.id && o.batch === batch);
  if (!last) return toast("इस बैच का पुराना ऑर्डर नहीं मिला");
  cart = {};
  last.items.forEach(i => cart[i.id] = i.qty);
  toast("पिछला ऑर्डर भर दिया");
  render();
}

function placeOrder() {
  const items = Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}));
  if (!items.length) return toast("पहले मात्रा चुनें");
  const shop = shopById(session.shopId);
  const existing = state.orders.find(o => o.shopId===shop.id && o.date===todayISO() && o.batch===batch && o.status==="pending");
  if (existing) {
    existing.items = items;
    existing.ts = Date.now();
    toast("आज का ऑर्डर अपडेट हो गया");
  } else {
    state.orders.push({
      id: "o"+Date.now(),
      shopId: shop.id,
      date: todayISO(),
      batch,
      items,
      status: "pending",
      ts: Date.now()
    });
    toast("ऑर्डर वेंडर के पास चला गया");
  }
  save(state);
  cart = {};
  render();
}

function renderVendor() {
  const date = todayISO();
  const todays = state.orders.filter(o => o.date === date);
  const byBatch = b => todays.filter(o => o.batch === b);
  const pending = todays.filter(o => o.status === "pending").length;

  const pack = {};
  todays.filter(o => o.batch === batch).forEach(o => {
    o.items.forEach(i => pack[i.id] = (pack[i.id]||0) + i.qty);
  });

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="logo">द</div>
        <div><strong>${VENDOR.name}</strong><small>आज ${fmtDate(date)}</small></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">बाहर</button>
    </div>
    <div class="screen">
      <div class="kpi">
        <div><b>${todays.length}</b><span>आज के ऑर्डर</span></div>
        <div><b>${pending}</b><span>बाकी डिलीवरी</span></div>
        <div><b>${shops().length}</b><span>दुकानें</span></div>
      </div>
      <div class="tabs">
        <div class="tab ${vendorTab==="orders"?"on":""}" onclick="vendorTab='orders';render()">ऑर्डर<small>सुबह / शाम</small></div>
        <div class="tab ${vendorTab==="shops"?"on":""}" onclick="vendorTab='shops';render()">दुकानें<small>जोड़ें / एडिट</small></div>
      </div>
      ${vendorTab==="shops" ? renderAdminShops() : `
      <div class="tabs">
        <div class="tab ${batch==="subah"?"on":""}" onclick="batch='subah';render()">
          सुबह<small>${byBatch("subah").length} ऑर्डर</small>
        </div>
        <div class="tab ${batch==="shaam"?"on":""}" onclick="batch='shaam';render()">
          शाम<small>${byBatch("shaam").length} ऑर्डर</small>
        </div>
      </div>
      <div class="card">
        <h3 class="dev" style="margin:0 0 8px">दूध मेनू</h3>
        <p class="hint" style="margin-top:0">दुकान वाला अपने लॉगिन से भी ऑर्डर दे सकता है। वेंडर नीचे हर दुकान पर प्रोडक्ट लिख सकता है।</p>
        ${PRODUCTS.map(p=>`<div class="order-line"><span>${p.emoji} ${p.name} · ${p.en}</span><b>₹${p.price}</b></div>`).join("")}
      </div>
      <div class="card">
        <h3 class="dev" style="margin:0 0 8px">पैकिंग लिस्ट · ${batch==="subah"?"सुबह":"शाम"}</h3>
        ${Object.keys(pack).length===0 ? `<p class="hint">इस बैच में अभी ऑर्डर नहीं।</p>` : `
          <table>
            <tr><th>प्रोडक्ट</th><th style="text-align:right">कुल</th></tr>
            ${Object.entries(pack).map(([id,qty])=>{
              const p=PRODUCTS.find(x=>x.id===id);
              return `<tr><td>${p.emoji} ${p.name}<br/><span class="hint">${p.en}</span></td><td style="text-align:right"><b>${qty}</b> ${p.unit}</td></tr>`;
            }).join("")}
          </table>`}
      </div>
      ${approvedShops().map(shop => {
        const o = todays.find(x => x.shopId===shop.id && x.batch===batch);
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <b>${shop.name}</b>
                <div class="hint">${shop.address}</div>
                <div class="hint">फोन: <a href="tel:${shop.phone}">${shop.phone}</a></div>
              </div>
              ${o ? `<span class="status ${o.status==="pending"?"pending":""}">${o.status==="pending"?"ऑर्डर आया":"डिलीवर"}</span>` : `<span class="pill">ऑर्डर नहीं</span>`}
            </div>
            ${o ? `
              <div style="margin-top:8px">
                ${o.items.map(i=>{
                  const p=PRODUCTS.find(x=>x.id===i.id);
                  return `<div class="order-line"><span>${p.emoji} ${p.en}</span><b>× ${i.qty}</b></div>`;
                }).join("")}
                <div style="margin-top:10px">
                  ${o.status==="pending"
                    ? `<button class="btn btn-dark" onclick="markDelivered('${o.id}')">डिलीवर मार्क करें</button>`
                    : `<p class="hint">डिलीवरी हो चुकी</p>`}
                </div>
              </div>` : ""}
            <div style="margin-top:12px;padding-top:10px;border-top:1px dashed #eadcc8">
              <b>इस दुकान का ऑर्डर लिखें</b>
              ${PRODUCTS.map(p => {
                const q = (vcart[shop.id] && vcart[shop.id][p.id]) || 0;
                return `<div class="prod">
                  <div class="emoji">${p.emoji}</div>
                  <div class="grow"><h4>${p.name}</h4><p>${p.en} · ₹${p.price}</p></div>
                  <div class="stepper">
                    <button onclick="vchg('${shop.id}','${p.id}',-1)">−</button>
                    <span>${q}</span>
                    <button onclick="vchg('${shop.id}','${p.id}',1)">+</button>
                  </div>
                </div>`;
              }).join("")}
              <button class="btn btn-primary" onclick="vendorPlace('${shop.id}')">${batch==="subah"?"सुबह":"शाम"} ऑर्डर सेव</button>
            </div>
          </div>`;
      }).join("")}
      <div class="card">
        <h3 class="dev" style="margin:0 0 8px">सभी दिन (डेमो)</h3>
        ${state.orders.length===0 ? `<p class="hint">अभी तक कोई ऑर्डर नहीं। दुकान से लॉगिन करके भेजें।</p>` :
          [...state.orders].reverse().slice(0,12).map(o=>{
            const shop=shopById(o.shopId);
            return `<div class="order-line"><span>${fmtDate(o.date)} · ${shop?shop.name:"दुकान"} · ${o.batch==="subah"?"सुबह":"शाम"}</span><span class="status ${o.status==="pending"?"pending":""}">${o.status}</span></div>`;
          }).join("")}
        <div style="margin-top:10px"><button class="btn btn-ghost" onclick="resetDemo()">डेमो डेटा मिटाएँ</button></div>
      </div>
      `}
    </div>
  `;
}

function vchg(shopId, pid, d) {
  if (!vcart[shopId]) vcart[shopId] = {};
  vcart[shopId][pid] = Math.max(0, (vcart[shopId][pid]||0) + d);
  if (!vcart[shopId][pid]) delete vcart[shopId][pid];
  render();
}

function vendorPlace(shopId) {
  const bag = vcart[shopId] || {};
  const items = Object.entries(bag).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}));
  if (!items.length) return toast("पहले दूध/दही की मात्रा चुनें");
  const existing = state.orders.find(o => o.shopId===shopId && o.date===todayISO() && o.batch===batch && o.status==="pending");
  if (existing) { existing.items = items; existing.ts = Date.now(); }
  else {
    state.orders.push({ id:"o"+Date.now(), shopId, date:todayISO(), batch, items, status:"pending", ts:Date.now() });
  }
  save(state);
  vcart[shopId] = {};
  toast("ऑर्डर सेव हो गया");
  render();
}

function markDelivered(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  o.status = "delivered";
  save(state);
  toast("डिलीवरी सेव हो गई");
  render();
}

function resetDemo() {
  if (!confirm("सारे ऑर्डर मिट जाएँगे?")) return;
  state.orders = [];
  save(state);
  toast("क्लियर");
  render();
}

let adminTab = "shops";

function renderAdmin() {
  const today = state.orders.filter(o => o.date === todayISO());
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="logo">अ</div>
        <div><strong>एडमिन डैशबोर्ड</strong><small>PIN से सुरक्षित</small></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">बाहर</button>
    </div>
    <div class="screen">
      <div class="kpi">
        <div><b>${shops().length}</b><span>दुकानें</span></div>
        <div><b>${today.length}</b><span>आज ऑर्डर</span></div>
        <div><b>${state.orders.length}</b><span>कुल ऑर्डर</span></div>
      </div>
      <div class="tabs">
        <div class="tab ${adminTab==="shops"?"on":""}" onclick="adminTab='shops';render()">दुकानें<small>नाम · पता · फोन · PIN</small></div>
        <div class="tab ${adminTab==="pins"?"on":""}" onclick="adminTab='pins';render()">PIN / ऑर्डर<small>एडमिन · वेंडर</small></div>
      </div>
      ${adminTab==="shops" ? renderAdminShops() : renderAdminPins()}
    </div>
  `;
}

function renderAdminShops() {
  return `
    <div class="card">
      <h3 class="dev" style="margin:0 0 10px">नई दुकान जोड़ें</h3>
      <label>दुकान का नाम</label>
      <input id="nName" placeholder="जैसे — गुप्ता किराना" />
      <div style="height:8px"></div>
      <label>पता</label>
      <input id="nAddr" placeholder="गली, मोहल्ला, शहर, पिनकोड" />
      <div style="height:8px"></div>
      <label>फोन नंबर</label>
      <input id="nPhone" inputmode="tel" placeholder="10 अंक" />
      <div style="height:8px"></div>
      <label>दुकान PIN (लॉगिन)</label>
      <input id="nPin" inputmode="numeric" placeholder="4 अंक, जैसे 4444" />
      <div style="height:12px"></div>
      <button class="btn btn-primary" onclick="addShop()">+ नई दुकान सेव करें</button>
    </div>
    ${pendingShops().length ? `<div class="card"><h3 class="dev" style="margin:0 0 8px">अप्रूवल बाकी</h3>
      ${pendingShops().map(s => `
        <div style="padding:8px 0;border-bottom:1px dashed #eadcc8">
          <b>${s.name}</b>
          <div class="hint">${s.address} · ${s.phone}</div>
          <label style="margin-top:8px">इस दुकान को PIN दें</label>
          <input id="apin-${s.id}" inputmode="numeric" placeholder="जैसे 4488" />
          <button class="btn btn-primary" style="margin-top:8px" onclick="approveShop('${s.id}')">PIN देकर अप्रूव करें</button>
        </div>`).join("")}
    </div>` : ""}
    ${shops().map(s => `
      <div class="card">
        <div style="display:flex;justify-content:space-between"><span class="pill">${s.status==="approved"?"अप्रूव्ड":"पेंडिंग"}</span></div>
        <label>दुकान का नाम</label>
        <input id="eName-${s.id}" value="${esc(s.name)}" />
        <div style="height:8px"></div>
        <label>पता</label>
        <input id="eAddr-${s.id}" value="${esc(s.address||"")}" />
        <div style="height:8px"></div>
        <label>फोन नंबर</label>
        <input id="ePhone-${s.id}" inputmode="tel" value="${esc(s.phone||"")}" />
        <div style="height:8px"></div>
        <label>दुकान PIN</label>
        <input id="ePin-${s.id}" inputmode="numeric" value="${esc(s.pin)}" />
        <div class="row" style="margin-top:12px">
          <button class="btn btn-dark" onclick="saveShop('${s.id}')">सेव / अपडेट</button>
          <button class="btn btn-ghost" onclick="delShop('${s.id}')">हटाएँ</button>
        </div>
      </div>
    `).join("")}
  `;
}

function renderAdminPins() {
  return `
    <div class="card">
      <h3 class="dev" style="margin:0 0 10px">एडमिन PIN बदलें</h3>
      <label>नया एडमिन PIN</label>
      <input id="aPin" inputmode="numeric" placeholder="अभी: ${state.adminPin}" />
      <div style="height:10px"></div>
      <button class="btn btn-dark" onclick="setAdminPin()">एडमिन PIN सेव</button>
    </div>
    <div class="card">
      <h3 class="dev" style="margin:0 0 10px">वेंडर PIN बदलें</h3>
      <label>नया वेंडर PIN</label>
      <input id="vPin" inputmode="numeric" placeholder="अभी: ${state.vendorPin}" />
      <div style="height:10px"></div>
      <button class="btn btn-dark" onclick="setVendorPin()">वेंडर PIN सेव</button>
    </div>
    <div class="card">
      <h3 class="dev" style="margin:0 0 8px">सारे ऑर्डर</h3>
      ${state.orders.length===0 ? `<p class="hint">अभी कोई ऑर्डर नहीं।</p>` :
        [...state.orders].reverse().slice(0,20).map(o=>{
          const shop=shopById(o.shopId);
          return `<div class="order-line"><span>${fmtDate(o.date)} · ${shop?shop.name:"?"} · ${o.batch==="subah"?"सुबह":"शाम"}</span><span class="status ${o.status==="pending"?"pending":""}">${o.status}</span></div>`;
        }).join("")}
    </div>
  `;
}

function esc(v) {
  return String(v||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function registerShop() {
  const name = document.getElementById("rName").value.trim();
  const address = document.getElementById("rAddr").value.trim();
  const phone = document.getElementById("rPhone").value.trim();
  if (!name || !address || !phone) return toast("नाम, पता और फोन भरें");
  if (shopByPhone(phone)) return toast("यह नंबर पहले से रजिस्टर है");
  state.shops.push({
    id: "s"+Date.now(), name, area: address.split(",")[0]||"", address, phone, pin: "", status: "pending"
  });
  save(state);
  showRegister = false;
  toast("रिक्वेस्ट गई — एडमिन PIN देकर अप्रूव करेगा");
  render();
}

function approveShop(id) {
  const s = shopById(id);
  if (!s) return;
  const inp = document.getElementById("apin-"+id);
  const pin = inp ? inp.value.trim() : "";
  if (pin.length < 4) return toast("इस दुकान के लिए 4 अंक का PIN लिखें");
  s.pin = pin;
  s.status = "approved";
  save(state);
  toast("अप्रूव + PIN सेट: " + pin);
  render();
}

function addShop() {
  const name = document.getElementById("nName").value.trim();
  const address = document.getElementById("nAddr").value.trim();
  const phone = document.getElementById("nPhone").value.trim();
  const pin = document.getElementById("nPin").value.trim();
  if (!name) return toast("दुकान का नाम डालें");
  if (!address) return toast("पता डालें");
  if (!phone) return toast("फोन नंबर डालें");
  if (!pin) return toast("दुकान PIN डालें");
  if (shopByPhone(phone)) return toast("यह नंबर पहले से है");
  state.shops.push({
    id: "s"+Date.now(),
    name,
    area: address.split(",")[0] || "",
    address,
    phone,
    pin,
    status: "approved"
  });
  save(state);
  toast("नई दुकान जुड़ गई");
  render();
}

function saveShop(id) {
  const s = shopById(id);
  if (!s) return;
  const name = document.getElementById("eName-"+id).value.trim();
  const address = document.getElementById("eAddr-"+id).value.trim();
  const phone = document.getElementById("ePhone-"+id).value.trim();
  const pin = document.getElementById("ePin-"+id).value.trim();
  if (!name || !address || !phone) return toast("नाम, पता और फोन भरें");
  Object.assign(s, { name, address, phone, pin: pin || s.pin, area: address.split(",")[0] || s.area });
  save(state);
  toast("दुकान अपडेट हो गई");
  render();
}

function delShop(id) {
  if (!confirm("यह दुकान हटाएँ?")) return;
  state.shops = state.shops.filter(s => s.id !== id);
  save(state);
  toast("हटा दी");
  render();
}

function setAdminPin() {
  const p = document.getElementById("aPin").value.trim();
  if (p.length < 4) return toast("कम से कम 4 अंक का PIN डालें");
  state.adminPin = p;
  save(state);
  toast("एडमिन PIN बदल गया");
  render();
}

function setVendorPin() {
  const p = document.getElementById("vPin").value.trim();
  if (p.length < 4) return toast("कम से कम 4 अंक का PIN डालें");
  state.vendorPin = p;
  save(state);
  toast("वेंडर PIN बदल गया");
  render();
}

render();
</script>
</body>
</html>
